name: remy
# Deploys remy from the pre-built GHCR service image. Both services share one
# image (ghcr.io/bracket/service-remy) and select their entry point via `command`.
#
# Env vars use optional interpolation (${VAR:-default}) so `docker compose down`
# runs without a full env. `up` requires the values below to be present.
#
# REMY_IMAGE_VERSION  — tag of the service-remy image to run (default: 0.1.0)
# REMY_CACHE          — notecard cache location for remy-api. Empty by default:
#                       the API is typically run on the host. To run it in the
#                       container, set REMY_CACHE to a container-visible path and
#                       add a bind mount for that path to the remy-api service.
services:
  remy-api:
    image: 'ghcr.io/bracket/service-remy:${REMY_IMAGE_VERSION:-0.1.0}'
    pull_policy: missing
    command: python -m remy.api --host 0.0.0.0 --port 42625
    ports:
      - "42625:42625"
    expose:
      - "42625"
    environment:
      REMY_CACHE: '${REMY_CACHE:-}'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  remy-mcp:
    image: 'ghcr.io/bracket/service-remy:${REMY_IMAGE_VERSION:-0.1.0}'
    pull_policy: missing
    command: python -m remy.mcp
    ports:
      - "42626:42626"
    expose:
      - "42626"
    environment:
      REMY_MCP_HOST: '0.0.0.0'
      REMY_MCP_PORT: '42626'
      REMY_API_URL: 'http://host.docker.internal:42625'
      REMY_MCP_DEBUG: '${REMY_MCP_DEBUG:-}'
      REMY_MCP_LOG_LEVEL: '${REMY_MCP_LOG_LEVEL:-WARNING}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
