[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remy"
version = "0.1.1"
description = "Notecards"
license = {text = "MIT"}
authors = [
    {name = "Bracket" }
]
requires-python = ">=3.12"
dependencies = [
    "lark",
    "sortedcontainers",
    "click",
    "python-dateutil",
    "pytz",
    "fastapi",
    "uvicorn",
    "httpx",
    "fastmcp",
    "watchdog",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "pytest",
    "sphinx",
    "httpx",
]

[project.scripts]
remy = "remy.cli.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
